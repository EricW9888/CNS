name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Frozen registry artifacts are checked against their commits.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Environment — dependency consistency and imports
        run: |
          python -m pip check
          python -c "import src.experiment, src.graded_model, src.lif_model, src.materialization, src.numerics, src.provenance, src.sparse_backend"

      - name: Repository policy and local-data manifest
        run: |
          python scripts/repository_policy_check.py
          python scripts/verify_local_data.py --allow-missing

      - name: Scientific model invariants
        run: python scripts/ci_tests.py model-invariants

      - name: Frozen record integrity and provenance
        run: |
          python scripts/ci_tests.py frozen-integrity
          python scripts/verify_experiment.py --all --integrity-only

      - name: Saved-input and observer smoke contracts
        run: python scripts/ci_tests.py replay-smoke

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests run_experiment.py run_exp002.py
